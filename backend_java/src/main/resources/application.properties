server.port=8080

# ---------- Base de datos (PostgreSQL) ----------
spring.datasource.url=jdbc:postgresql://database:5432/walle_db
spring.datasource.username=walle
spring.datasource.password=JKM
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ---------- ESP32 principal (motores y servos) ----------
# El backend se conecta como cliente WebSocket, igual que lo hace la página web.
walle.esp32.ws-url=${ESP32_WS_URL:ws://192.168.137.200/ws}

# ---------- Modelo de IA (YOLO exportado a ONNX) ----------
walle.modelo.ruta=${MODEL_PATH:modelos/CNN_Basura.onnx}
walle.modelo.tamano=${IMG_SIZE:640}
walle.modelo.clases=${CLASSES:Caja,bota,boteAluminio,papelHigienico}
# Confianza mínima para que el robot ACTÚE (más alta que la de la página de pruebas)
walle.modelo.confianza=${CONF:0.60}
walle.modelo.iou=${IOU:0.45}

# ---------- Modo autónomo ----------
# MANUAL: el robot solo detecta y muestra. AUTONOMO: detecta y actúa.
walle.modo-inicial=${WALLE_MODO_INICIAL:MANUAL}
walle.autonomo.buscar=${WALLE_BUSCAR:true}
walle.autonomo.basura-maxima=1

# Velocidad de los motores (0-255). Más bajo = más lento. Si un motor no arranca, súbelo de 10 en 10.
walle.autonomo.pwm-avance=130
walle.autonomo.pwm-giro=140
# Velocidad al acercarse al objeto y al meter/soltar la basura.
# (115 era muy bajo: el motor "pitaba" y no se movía. Si aún pita, súbelo.)
walle.autonomo.pwm-acercamiento=140
# Impulso de arranque: un golpe corto y fuerte antes de bajar a la velocidad pedida,
# para vencer la fricción cuando el motor está parado.
walle.autonomo.pwm-arranque=180
walle.autonomo.ms-arranque=80
# Duración de cada empujón (milisegundos) y pausa para que la imagen se estabilice
walle.autonomo.ms-avance=300
walle.autonomo.ms-giro=200
walle.autonomo.ms-estabilizar=700
walle.autonomo.ms-empujar=600
# Tiempo que espera a que los servos terminen de moverse (si ralentizas los servos, súbelo)
walle.autonomo.ms-servo=1000
# Patrulla sin objetivo: cuántos pasos avanza antes de girar un poco
walle.autonomo.patrulla-avances=3

# Rotación de la foto de la cámara, en grados en sentido de las manecillas del reloj: 0, 90, 180 o 270.
# Ejemplo: si hay que girar la imagen 90 grados hacia la IZQUIERDA, usa 270. Si queda al revés, prueba 90.
walle.camara.rotacion-grados=0

# Saludo con los brazos (arriba y abajo)
walle.autonomo.ms-saludo=700
walle.autonomo.saludo-repeticiones=3

# Cierre de las compuertas DESPACIO: cuántos pasos y cuántos ms dura cada uno (16 x 100 ms = 1.6 s).
# Más pasos o más ms = más lento.
walle.servos.pasos-cierre=16
walle.servos.ms-paso-cierre=100

# Ángulos de los brazos cuando están ARRIBA (reposo = 50). Pruébalos con el panel antes de usar el modo autónomo.
walle.servos.brazo-der-alto=20
walle.servos.brazo-izq-alto=80

# --- Distancia de recogida (bounding box) ---
# El robot abre las compuertas cuando el borde de ABAJO del bounding box del objeto llega a este valor (0 a 1).
# No lo adivines: pon el objeto a 11 cm, centrado, y pulsa "Calibrar 11 cm" en el panel; te dice el valor.
walle.autonomo.umbral-borde-inferior=0.85
# Qué tan descentrado puede estar el objeto y aun así recogerlo (0.15 = "casi centrado")
walle.autonomo.tolerancia-centro=0.15
# Pon true si el robot gira al lado contrario del objeto
walle.autonomo.invertir-giro=false

# --- Marcadores ArUco (los detecta el servicio Python 'ai-engine') ---
walle.vision.url=${VISION_URL:http://ai-engine:5000}
# A QUÉ DISTANCIA "LLEGA" AL MARCADOR Y ACTÚA:
# el robot actúa cuando el bounding box del marcador ocupa esta fracción del ALTO de la foto (0 a 1).
#   0.30 = el marcador ocupa el 30 % del alto de la foto.  Más grande = más cerca (se acerca más antes de actuar).
#   Más chico = actúa desde más lejos.  Si la distancia se reduce a la mitad, el valor se duplica.
# No lo adivines: con el robot en MANUAL pon el marcador a la distancia deseada y pulsa "Calibrar ArUco" en el panel.
walle.aruco.umbral-alto=0.30
# Qué tan centrado debe verse el marcador antes de actuar (0.15 = puede desviarse un 15 % de la foto a cada lado)
walle.aruco.tolerancia-centro=0.15
# Cuánto debe girar para dar un giro de 90 grados (milisegundos). 180 grados = el doble. CALIBRA este valor.
walle.aruco.ms-giro-90=900
# Después de atender un marcador, lo ignora este tiempo para no repetir la acción
walle.aruco.ms-cooldown=6000

# --- Caras (red de reconocimiento facial, corre en el servicio Python 'ai-engine') ---
walle.caras.activo=true
# La saluda (brazos arriba y abajo) solo si ve una cara conocida y no la ha saludado en este tiempo
walle.caras.cooldown-ms=30000
# Altura mínima de la cara en la foto (0 a 1) para saludar: evita saludar a quien está lejos
walle.caras.alto-minimo=0.15
# true = también saluda a personas que no reconoce
walle.caras.saludar-desconocidos=false
