version: '3.8'

services:
  # 1. Base de Datos PostgreSQL
  database:
    image: postgres:15-alpine
    container_name: walle_db
    restart: always
    environment:
      POSTGRES_DB: walle_db
      POSTGRES_USER: walle
      POSTGRES_PASSWORD: JKM
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - shared_backups:/var/backups/walle

  # 2. Servidor Backend en Java (Spring Boot)
  backend:
    build:
      context: ./backend_java
      dockerfile: Dockerfile
    container_name: walle_backend
    restart: always
    ports:
      - "9090:8080"  # <- 9090 para liberar el 8080 para tu panel manual
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/walle_db
      SPRING_DATASOURCE_USERNAME: walle
      SPRING_DATASOURCE_PASSWORD: JKM
      # --- Modelo YOLO (se monta como volumen, no va dentro de la imagen) ---
      MODEL_PATH: /app/modelos/CNN_Basura.onnx
      # --- ESP32 principal (motores y servos) ---
      ESP32_WS_URL: ws://192.168.137.200/ws
      # --- Cómo arranca el robot: MANUAL (solo detecta) o AUTONOMO (detecta y actúa) ---
      WALLE_MODO_INICIAL: MANUAL
    depends_on:
      - database
    volumes:
      - shared_backups:/app/backups
      - ./dataset_fotos:/app/dataset_fotos
      - ./EntrenamientoNeuronal/modelos:/app/modelos:ro

  # 3. Servicio de Visión y Red Neuronal (Python + OpenCV + ArUco)
  ai-engine:
    build:
      context: ./Vision
      dockerfile: Dockerfile
    container_name: walle_ai
    restart: always
    ports:
      - "5000:5000"
    volumes:
      - ./EntrenamientoNeuronal:/app/EntrenamientoNeuronal
      - ./dataset_fotos:/app/dataset_fotos
    depends_on:
      - backend

  # 4. Frontend Principal (Dashboard de Estados en el puerto 80)
  frontend:
    build:
      context: ./frontend_web1
      dockerfile: Dockerfile
    container_name: walle_web
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

  # 5. Frontend 2 (Panel de Control Manual en el puerto 8080)
  frontend_manual:
    build:
      context: ./frontend_web2
      dockerfile: Dockerfile
    container_name: walle_web_manual
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  db_data:
  shared_backups:
    driver: local
