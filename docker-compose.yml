version: '3.8'

services:
  # 1. Base de Datos PostgreSQL
  database:
    image: postgres:15-alpine
    container_name: walle_db
    restart: always
    environment:
      POSTGRES_DB: Wall_e
      POSTGRES_USER: Osiris
      POSTGRES_PASSWORD: Alfrezzy
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - shared_backups:/var/backups/walle

  # 2. Servidor Backend en Java (Spring Boot)
  backend_java:
    build: ./backend_java
    ports:
      - "8080:8080"
    volumes:
      - ./dataset_fotos:/app/dataset_fotos
    restart: always
  #   environment:
  #     SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/walle_db
  #     SPRING_DATASOURCE_USERNAME: Osiris
  #     SPRING_DATASOURCE_PASSWORD: Alfrezzy
  #   depends_on:
  #     - database
  #   volumes:
  #     - shared_backups:/app/backups

  # 3. Servicio de Visión y Red Neuronal (Python) - Descomentar cuando lo uses
  # ai-engine:
  #   build:
  #     context: ./vision
  #     dockerfile: Dockerfile
  #   container_name: walle_ai
  #   restart: always
  #   ports:
  #     - "5000:5000" # Puerto para el servidor de Python / captura de dataset
  #   depends_on:
  #     - backend

  # 4. Frontend Web 1
  frontend:
    build:
      context: ./frontend_web1
      dockerfile: Dockerfile
    container_name: walle_web
    restart: always
    ports:
      - "80:80"

  # 5. Frontend Web 2 / Panel Alternativo
  frontend_web2:
    build: 
      context: ./frontend_web2
      dockerfile: Dockerfile
    ports:
      - "8082:80"
    depends_on:
      - backend_java

volumes:
  db_data:
  shared_backups:
    driver: local