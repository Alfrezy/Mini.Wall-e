version: '3.8'

services:
  # 1. Base de Datos PostgreSQL
  database:
    image: postgres:15-alpine
    container_name: walle_db
    restart: always
    environment:
      POSTGRES_DB: walle_db
      POSTGRES_USER: walle_user
      POSTGRES_PASSWORD: walle_password
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - shared_backups:/var/backups/walle

  # 2. Servidor Backend en Java (Spring Boot)
  backend:
    build:
      context: ./backend_java
      dockerfile: Dockerfile
    container_name: walle_backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/walle_db
      SPRING_DATASOURCE_USERNAME: walle_user
      SPRING_DATASOURCE_PASSWORD: walle_password
    depends_on:
      - database
    volumes:
      - shared_backups:/app/backups
      - ./dataset_fotos:/app/dataset_fotos

  # 3. Servicio de Visión y Red Neuronal (Python + OpenCV + ArUco)
  ai-engine:
    build:
      context: ./vision
      dockerfile: Dockerfile
    container_name: walle_ai
    restart: always
    ports:
      - "5000:5000"
    volumes:
      - ./EntrenamientoNeuronal:/app/EntrenamientoNeuronal  # <-- Añadido para que la IA acceda al dataset local
      - ./dataset_fotos:/app/dataset_fotos                  # Fotos que manda el robot en tiempo real
    depends_on:
      - backend

  # 4. Frontend Web Principal
  frontend:
    build:
      context: ./frontend_web1
      dockerfile: Dockerfile
    container_name: walle_web
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  db_data:
  shared_backups:
    driver: local