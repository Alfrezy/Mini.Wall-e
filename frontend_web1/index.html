<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenido a Mini Wall-e</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <div class="capa-opaca"></div>

    <div class="dashboard-container">
        <div class="header">
            <h1>Bienvenido a Mini Wall-e</h1>
            <p class="subtitulo">proceso del robot</p>
        </div>

        <div class="flex-menu" id="menu-estados">
            
            <!-- Tarjeta 1: Patrullando -->
            <div class="card-btn activo" id="tarjeta-patrullando">
                <div class="animacion-contenedor">
                    <!-- Ojos de WALL-E (Activo) -->
                    <form class="outer-face">
                        <input class="inner-face" id="eyes-1" type="checkbox" checked/>
                        <label for="eyes-1"></label>
                    </form>
                    <!-- Cargador (Inactivo) -->
                    <div class="lds-facebook oculto"><div></div><div></div><div></div></div>
                </div>
                <h3>Patrullando</h3>
            </div>

            <!-- Tarjeta 2: Recogiendo Basura -->
            <div class="card-btn" id="tarjeta-basura">
                <div class="animacion-contenedor">
                    <!-- Ojos de WALL-E (Activo) -->
                    <form class="outer-face">
                        <input class="inner-face" id="eyes-2" type="checkbox" checked/>
                        <label for="eyes-2"></label>
                    </form>
                    <!-- Cargador (Inactivo) -->
                    <div class="lds-facebook oculto"><div></div><div></div><div></div></div>
                </div>
                <h3>Recogiendo Basura</h3>
            </div>

            <!-- Tarjeta 3: Plantando Plantas -->
            <div class="card-btn" id="tarjeta-plantando">
                <div class="animacion-contenedor">
                    <!-- Ojos de WALL-E (Activo) -->
                    <form class="outer-face">
                        <input class="inner-face" id="eyes-3" type="checkbox" checked/>
                        <label for="eyes-3"></label>
                    </form>
                    <!-- Cargador (Inactivo) -->
                    <div class="lds-facebook oculto"><div></div><div></div><div></div></div>
                </div>
                <h3>Plantando Plantas</h3>
            </div>

        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
