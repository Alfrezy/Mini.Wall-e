<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel de Control - Mini Wall-E</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

    <h1>🤖 Mini Wall-E: Panel de Control Avanzado</h1>
    <hr>

    <div class="main-container">
        <!-- Video en vivo de la ESP32-CAM -->
        <div class="video-box" id="videoContainer">
            <img id="streamCam" alt="Cámara de Wall-E" style="width: 100%; max-width: 640px; height: auto; border-radius: 5px;" />
        </div>

        <!-- Panel de control interactivo -->
        <div class="controller-panel">
            <h3>MANDO DE CONTROL</h3>
            
            <!-- Control de Orugas (Mapeo estándar: W=Adelante, A=Izq, D=Der, S=Atrás) -->
            <div class="dpad">
                <div></div>
                <button id="btn-w" class="btn-control btn-up" onmousedown="enviarComandoMovimiento(2, 200)" onmouseup="enviarComandoMovimiento(0, 0)">W</button>
                <div></div>
                <button id="btn-a" class="btn-control btn-left" onmousedown="enviarComandoMovimiento(1, 200)" onmouseup="enviarComandoMovimiento(0, 0)">A</button>
                <div></div>
                <button id="btn-d" class="btn-control btn-right" onmousedown="enviarComandoMovimiento(3, 200)" onmouseup="enviarComandoMovimiento(0, 0)">D</button>
                <div></div>
                <button id="btn-s" class="btn-control btn-down" onmousedown="enviarComandoMovimiento(8, 200)" onmouseup="enviarComandoMovimiento(0, 0)">S</button>
                <div></div>
            </div>

            <!-- Controles Servos -->
            <div class="extra-controls" style="grid-template-columns: 1fr 1fr; font-size: 11px;">
                <button class="btn-action" onclick="bajarBrazo('brazo_der')">B.Der Bajar</button>
                <button class="btn-action" onclick="brazoInicial('brazo_der')">B.Der Posición inicial</button>
                <button class="btn-action" onclick="bajarBrazo('brazo_izq')">B.Izq Bajar</button>
                <button class="btn-action" onclick="brazoInicial('brazo_izq')">B.Izq Posición inicial</button>
                <button class="btn-action" onclick="enviarServo('compuerta_der', 0)">P.Der Abrir (0°)</button>
                <button class="btn-action" onclick="enviarServo('compuerta_der', 90)">P.Der Cerrar (90°)</button>
                <button class="btn-action" onclick="enviarServo('compuerta_izq', 0)">P.Izq Abrir (0°)</button>
                <button class="btn-action" onclick="enviarServo('compuerta_izq', 90)">P.Izq Cerrar (90°)</button>
            </div>

            <button id="btn-foto" class="btn-action btn-dataset" onclick="capturarFotoDataset('basura')">📷 CAPTURAR FOTO (DATASET)</button>

            <div class="info-text">
                <b>Teclado activo:</b><br>
                • Orugas: <b>W, A, S, D</b> (Se detienen al soltar)<br>
                • Brazos: <b>Z</b> (izq) / <b>X</b> (der) bajan un poco y al soltar vuelven a la posición inicial<br>
                • Compuertas: <b>C</b> abrir / <b>V</b> cerrar<br>
                • Foto Dataset: <b>F</b>
            </div>
        </div>
    </div>

    <script src="js/teclado.js"></script>
</body>
</html>
